; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = slidepod

[env]
; Pinned: Arduino core 2.0.14 (platform 6.5.0). NimBLE-Arduino 1.4 is made
; for the 2.x core; built on 3.x (platform 8) it corrupts the heap as BLE
; starts and the pod boot-loops (firmware 0.5.1 from CI did). Change these
; only with a test on a pod.
build_flags = 
	-D USER_SETUP_LOADED
	-include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D ARDUINO_USB_MODE=1

[env:lilygo-t-display-s3]
platform = espressif32 @ 6.5.0
board = lilygo-t-display-s3
framework = arduino
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	mathertel/OneButton@^2.5.0
	pololu/VL53L0X@^1.3.1

[env:slidepod-sim]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
build_src_filter = -<*> +<slidepod/>
build_flags = 
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D WOKWI_SIM

[env:slidepod-wokwi]
; Wokwi simulation of the rev 0.2 board (sim/wokwi-rev2): the real-hardware firmware
; (rev 0.2 pins, Pololu VL53L1X driver) against an emulated VL53L1X custom chip.
; No BLE (Wokwi doesn't simulate it); Serial goes to UART0 for the Wokwi serial monitor.
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = -<*> +<slidepod/>
build_flags = 
	-D SLIDEPOD_REV=2
	-D SLIDEPOD_NO_BLE
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D DISABLE_ALL_LIBRARY_WARNINGS
lib_deps = 
	pololu/VL53L1X@1.3.1

; rev 0.1 boards (30 x 50 mm). For rev 0.2 boards use slidepod-rev2.
[env:slidepod]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = -<*> +<slidepod/>
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DISABLE_ALL_LIBRARY_WARNINGS
upload_protocol = esptool
monitor_speed = 115200
lib_deps = 
	pololu/VL53L1X@1.3.1
	h2zero/NimBLE-Arduino@1.4.3

[env:slidepod-rev2]
; rev 0.2 boards (32 x 26 mm): same firmware with the rev 0.2 pin map
; (ToF IO38/39, LEDs IO42/41/40, IMU bus IO48/35). pio run -e slidepod-rev2 -t upload
extends = env:slidepod
build_flags = 
	${env:slidepod.build_flags}
	-D SLIDEPOD_REV=2
