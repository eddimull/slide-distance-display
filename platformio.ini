; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
build_flags = 
	-D USER_SETUP_LOADED
	-include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D ARDUINO_USB_MODE=1

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	mathertel/OneButton@^2.5.0
	pololu/VL53L0X@^1.3.1

; ── SlidePod rev 0.1 firmware ───────────────────────────────────────────
[env:slidepod-sim]
; Wokwi simulation. Build, then open sim/wokwi/ in the Wokwi VS Code extension.
; The wokwi-vl53l0x device proxies the VL53L1X (same I2C address 0x29).
; Drag the sensor's distance slider to simulate slide movement.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
src_filter = -<*> +<slidepod/>
build_flags =
	-D ARDUINO_USB_MODE=1
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D WOKWI_SIM
lib_deps =
	pololu/VL53L0X@^1.3.1

[env:slidepod]
; Real SlidePod hardware: ESP32-S3-MINI-1 + VL53L1X.
; pio run -e slidepod -t upload
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
src_filter = -<*> +<slidepod/>
build_flags =
	-D ARDUINO_USB_MODE=1
	-D DISABLE_ALL_LIBRARY_WARNINGS
upload_protocol = esptool
monitor_speed = 115200
lib_deps =
	pololu/VL53L1X@^1.3.1
