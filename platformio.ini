; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
;   slidepod             SlidePod rev 0.1 board (hardware/): ESP32-S3-MINI-1, VL53L1X, piezo, BLE
;   native               host unit tests for lib/slidepod_core:  pio test -e native
;   lilygo-t-display-s3  original LilyGo T-Display prototype (src/*.ino, kept for reference)

[platformio]
default_envs = slidepod

[env:slidepod]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1          ; same S3 + 8 MB quad flash, no PSRAM, as the MINI-1-N8
framework = arduino
build_src_filter = +<slidepod/>
build_flags =
	-D ARDUINO_USB_MODE=1           ; flash and log over the S3's built-in USB-Serial/JTAG
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=2
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
lib_deps =
	pololu/VL53L1X@^1.3.1
	h2zero/NimBLE-Arduino@^1.4.2
lib_ignore = arduino-audio-tools
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall
lib_ignore = arduino-audio-tools, kalman

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
build_src_filter = +<*> -<slidepod/>
build_flags =
	-D USER_SETUP_LOADED
	-include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D ARDUINO_USB_MODE=1
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	mathertel/OneButton@^2.5.0
	pololu/VL53L0X@^1.3.1
lib_ignore = slidepod_core
