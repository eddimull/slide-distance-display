name: Firmware

# Builds the SlidePod firmware for each board, and on main signs it and
# publishes it for over-the-air updates, to beta first:
#  - main: the `firmware` release gets slidepod-rev<N>-<version>.bin (and
#    .elf, to decode crash backtraces) and manifest-beta.json. Only pods
#    whose owner turned on "Test firmware" in the app are offered it.
#  - Run this workflow by hand with "promote" once the beta has run on a
#    pod: manifest-beta.json becomes manifest.json, offered to everyone.
# seventh-server's deploy copies the manifests and the builds they list to
# https://seventh.app/firmware/ (its scripts/fetch-firmware.sh). Pods only
# install an image signed with the key whose public half is
# src/slidepod/ota_key.h, and roll back one that doesn't start.
#
# Bump SLIDEPOD_FW in src/slidepod/main.cpp for each release: pods update
# only to a newer version, and publishing changed code under a version
# that's already out fails.

on:
  push:
    branches: [main]
    paths: ['src/**', 'include/**', 'platformio.ini', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['src/**', 'include/**', 'platformio.ini', '.github/workflows/firmware.yml']
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote the beta firmware to everyone (no build)'
        type: boolean
        default: false

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.promote }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build
        run: pio run -e slidepod -e slidepod-rev2 -e slidepod-sim | tee build.log
      # The pods run what's tested on them: Arduino core 2.0.14 with NimBLE
      # 1.4.3. Built on core 3.x, NimBLE 1.4 corrupts the heap at boot and
      # the pod boot-loops (0.5.0 and 0.5.1 did). Fail rather than publish
      # a build on anything else.
      - name: Check the toolchain
        run: |
          grep -q 'framework-arduinoespressif32 @ 3.20014.231204 (2.0.14)' build.log ||
            { echo "::error::Not built on Arduino core 2.0.14; see platformio.ini."; exit 1; }
          grep -q 'NimBLE-Arduino @ 1.4.3' build.log ||
            { echo "::error::Not built with NimBLE-Arduino 1.4.3."; exit 1; }
      - id: version
        run: |
          v=$(grep -oP '#define SLIDEPOD_FW "\K[^"]+' src/slidepod/main.cpp)
          echo "Firmware $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: |
          mkdir out
          v=${{ steps.version.outputs.version }}
          cp .pio/build/slidepod/firmware.bin "out/slidepod-rev1-$v.bin"
          cp .pio/build/slidepod/firmware.elf "out/slidepod-rev1-$v.elf"
          cp .pio/build/slidepod-rev2/firmware.bin "out/slidepod-rev2-$v.bin"
          cp .pio/build/slidepod-rev2/firmware.elf "out/slidepod-rev2-$v.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/slidepod/ota_key.h
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out
      - name: Sign, and check against the pods' public key
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          if [ -z "$FIRMWARE_SIGNING_KEY" ]; then
            echo "::error::FIRMWARE_SIGNING_KEY isn't set; nothing is published."
            exit 1
          fi
          umask 077
          printf '%s\n' "$FIRMWARE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          # The public key the pods were built with, from ota_key.h.
          sed -n 's/^ *"\(.*\)\\n";\{0,1\}$/\1/p' src/slidepod/ota_key.h > "$RUNNER_TEMP/pub.pem"
          cd out
          for rev in 1 2; do
            f="slidepod-rev$rev-$VERSION.bin"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$f.sig" "$f"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature "$f.sig" "$f"
          done
          rm "$RUNNER_TEMP/key.pem"
      - name: Manifest
        run: |
          cd out
          python3 - <<'PY'
          import base64, hashlib, json, os
          v = os.environ['VERSION']
          builds = {}
          for rev in (1, 2):
              f = f'slidepod-rev{rev}-{v}.bin'
              data = open(f, 'rb').read()
              builds[str(rev)] = {
                  'file': f,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'signature': base64.b64encode(open(f + '.sig', 'rb').read()).decode(),
              }
          json.dump({'version': v, 'builds': builds}, open('manifest-beta.json', 'w'), indent=1)
          PY
          cat manifest-beta.json
      - name: Refuse changed code under a version that's out
        run: |
          for m in manifest.json manifest-beta.json; do
            gh release download firmware -p "$m" -O "old-$m" 2>/dev/null || continue
            python3 - "old-$m" <<'PY'
          import json, sys
          old, new = json.load(open(sys.argv[1])), json.load(open('out/manifest-beta.json'))
          if old.get('version') != new['version']:
              sys.exit(0)
          for rev, b in new['builds'].items():
              o = old.get('builds', {}).get(rev)
              if o and o['sha256'] != b['sha256']:
                  print(f"::error::Firmware {new['version']} is already published with different code: bump SLIDEPOD_FW.")
                  sys.exit(1)
          print(f"Same build as in {sys.argv[1]}; republishing.")
          PY
          done
      - name: Publish to the `firmware` release, as the beta
        run: |
          gh release view firmware >/dev/null 2>&1 ||
            gh release create firmware --title "SlidePod firmware" --latest=false \
              --notes "Signed firmware for over-the-air updates, served at https://seventh.app/firmware/: manifest-beta.json on every firmware change on main, manifest.json once promoted."
          gh release upload firmware out/manifest-beta.json out/slidepod-rev*-"$VERSION".bin out/slidepod-rev*-"$VERSION".elf --clobber
      - name: Deploy seventh.app
        id: deploy
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_DEPLOY_HOOK }}
        run: |
          if [ -z "$FORGE_DEPLOY_HOOK" ]; then
            echo "::warning::FORGE_DEPLOY_HOOK isn't set; the firmware goes live on seventh.app's next deploy."
            exit 0
          fi
          live() {
            curl -sf "https://seventh.app/firmware/manifest-beta.json?v=$RANDOM" | grep -q "\"version\": \"$VERSION\""
          }
          # Forge ignores a hook while a deploy is running: call it again.
          for attempt in 1 2 3; do
            curl --fail-with-body -sS -X POST "$FORGE_DEPLOY_HOOK"
            for i in $(seq 1 24); do
              if live; then echo "Live after deploy $attempt."; echo "live=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              sleep 10
            done
          done
          echo "::error::seventh.app isn't serving firmware $VERSION; check the deploy in Forge."
          exit 1
      - name: Purge Cloudflare's copy of /firmware/
        if: steps.deploy.outputs.live == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then exit 0; fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"prefixes":["seventh.app/firmware/"]}' | jq -e '.success'

  # Run by hand: the beta becomes the firmware everyone is offered.
  promote:
    if: ${{ inputs.promote }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: manifest-beta.json becomes manifest.json
        id: promote
        run: |
          mkdir out
          gh release download firmware -p manifest-beta.json -O out/manifest.json
          v=$(python3 -c "import json; print(json.load(open('out/manifest.json'))['version'])")
          echo "Promoting firmware $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          gh release upload firmware out/manifest.json --clobber
      - name: Deploy seventh.app
        id: deploy
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_DEPLOY_HOOK }}
          VERSION: ${{ steps.promote.outputs.version }}
        run: |
          live() {
            curl -sf "https://seventh.app/firmware/manifest.json?v=$RANDOM" | grep -q "\"version\": \"$VERSION\""
          }
          for attempt in 1 2 3; do
            curl --fail-with-body -sS -X POST "$FORGE_DEPLOY_HOOK"
            for i in $(seq 1 24); do
              if live; then echo "Live after deploy $attempt."; echo "live=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              sleep 10
            done
          done
          echo "::error::seventh.app isn't serving firmware $VERSION; check the deploy in Forge."
          exit 1
      - name: Purge Cloudflare's copy of /firmware/
        if: steps.deploy.outputs.live == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then exit 0; fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"prefixes":["seventh.app/firmware/"]}' | jq -e '.success'
